<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zeta Store</title>
  <meta name="description" content="Zeta Store — belanja mudah, checkout via WhatsApp." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="wrap nav">
    <a class="brand" href="#">
      <span class="logo"></span>
      <span class="brand-name">Zeta Store</span>
    </a>

    <div class="nav-right">
      <div class="search">
        <input id="q" placeholder="Cari produk…" autocomplete="off" />
      </div>

      <button class="cart-btn" id="openCart" aria-label="Buka keranjang">
        🛒 <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero card">
      <div class="hero-row">
        <div>
          <h1>Toko simpel, cepat, dan siap jualan.</h1>
          <p class="muted">Pilih produk → masuk keranjang → checkout via WhatsApp ✅</p>
          <div class="chips">
            <button class="chip active" data-cat="all">Semua</button>
            <button class="chip" data-cat="digital">Digital</button>
            <button class="chip" data-cat="fashion">Fashion</button>
            <button class="chip" data-cat="tools">Tools</button>
          </div>
        </div>
        <div class="mini-stat">
          <div class="mini-box">
            <b>⚡ Fast</b><span class="muted">Statis di Vercel</span>
          </div>
          <div class="mini-box">
            <b>🧾 Cart</b><span class="muted">LocalStorage</span>
          </div>
          <div class="mini-box">
            <b>💬 Checkout</b><span class="muted">WhatsApp</span>
          </div>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="muted" id="resultInfo">Menampilkan semua produk</div>
      <select id="sort">
        <option value="reco">Rekomendasi</option>
        <option value="low">Harga termurah</option>
        <option value="high">Harga termahal</option>
        <option value="az">Nama A–Z</option>
      </select>
    </section>

    <section id="products" class="products"></section>

    <footer class="footer">
      <small>© <span id="year"></span> Zeta Store • Powered by Zeta</small>
    </footer>
  </main>

  <!-- CART DRAWER -->
  <div class="drawer-backdrop" id="backdrop" hidden></div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3>Keranjang</h3>
      <button class="icon-btn" id="closeCart" aria-label="Tutup">✕</button>
    </div>

    <div class="drawer-body">
      <div id="cartEmpty" class="empty">
        Keranjang masih kosong 😄
      </div>

      <div id="cartItems" class="cart-items"></div>

      <div class="summary">
        <div class="row">
          <span class="muted">Subtotal</span>
          <b id="subtotal">Rp 0</b>
        </div>
        <div class="row">
          <span class="muted">Catatan</span>
        </div>
        <textarea id="note" rows="3" placeholder="Contoh: warna hitam, size L / kirim jam 8 malam"></textarea>

        <div class="row">
          <span class="muted">Nama</span>
        </div>
        <input id="buyerName" placeholder="Nama kamu" />

        <div class="row">
          <span class="muted">Alamat</span>
        </div>
        <textarea id="buyerAddress" rows="3" placeholder="Alamat lengkap (opsional kalau produk digital)"></textarea>

        <button class="btn" id="checkout">Checkout via WhatsApp</button>
        <button class="btn ghost" id="clearCart">Kosongkan Keranjang</button>

        <small class="muted" id="cartMsg"></small>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
